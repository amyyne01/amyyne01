name: Build projects

# Rebuild the animated Projects section whenever the list changes.
on:
  push:
    branches: [main]
    paths:
      - projects.json
      - scripts/build_projects.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_projects.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/projects
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: rebuild projects section"
          git push
